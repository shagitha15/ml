[project]
name = "ml-challenge"
version = "0.1.0"
description = "Multi-Source Entity Resolution ML Challenge"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "duckdb>=1.5.5",
    "lightgbm>=4.7.0",
    "pandas>=3.0.6",
    "polars>=1.44.2",
    "rapidfuzz>=3.14.6",
    "scikit-learn>=1.9.1",
    "unidecode>=1.4.0",
    "xgboost>=3.4.1",
]

[tool.pyright]
executionEnvironments = [
  { root = "." }
]

